name: Apply D1 migrations

# Applies migrations/*.sql to the production D1 database "metanoia" (wrangler
# tracks which ones already ran, so re-running is safe). Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (an account token with D1 Edit permission; create
# it under My Profile → API Tokens → Create Token → "Edit Cloudflare Workers"
# template, then add D1:Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ['migrations/**', 'wrangler.toml', '.github/workflows/d1-migrate.yml']
  workflow_dispatch:

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | grep -oE '[0-9a-f]{32}' | head -1)"
          npx --yes wrangler@4 d1 migrations list metanoia --remote
          npx --yes wrangler@4 d1 migrations apply metanoia --remote
