name: Sync lesson media to R2

# The lesson media (prototype/assets/lms, about 2 GB) is served from a Cloudflare R2
# bucket rather than the Pages artifact. This job mirrors the folder to the bucket
# whenever it changes on main. It needs three repository secrets, created from an
# R2 API token with object read/write on the bucket (Cloudflare dashboard → R2 →
# Manage R2 API tokens): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
# The bucket name is R2_BUCKET (a repository variable; defaults to metanoia-media).

on:
  push:
    branches: [main]
    paths: ['prototype/assets/lms/**', '.github/workflows/sync-media.yml']
  workflow_dispatch:

concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone (Ubuntu package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Mirror prototype/assets/lms to the bucket's lms/ prefix
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACL: private
          RAW_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RAW_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RAW_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.R2_BUCKET || 'metanoia-media' }}
        run: |
          # Tolerate values pasted with labels, the S3 hostname or stray whitespace:
          # the account id is the first 32-hex token, the keys are trimmed.
          ACCOUNT="$(printf '%s' "${RAW_ACCOUNT_ID}" | grep -oE '[0-9a-f]{32}' | head -1 || true)"
          # R2 S3 credentials: the Access Key ID is 32 hex characters and the Secret Access Key is 64.
          # (The 40-character "Token value" on the same Cloudflare screen is not used here.)
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$(printf '%s' "${RAW_ACCESS_KEY_ID}" | grep -oE '[0-9a-f]{32}' | head -1 || true)"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$(printf '%s' "${RAW_SECRET_ACCESS_KEY}" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${ACCOUNT}.r2.cloudflarestorage.com"
          test -n "${ACCOUNT}" || { echo "::error::R2_ACCOUNT_ID does not contain a 32-character account id"; exit 1; }
          test -n "${RCLONE_CONFIG_R2_ACCESS_KEY_ID}" || { echo "::error::R2_ACCESS_KEY_ID is not a 32-character hex Access Key ID. On the Cloudflare token screen use 'Access Key ID', not 'Token value'."; exit 1; }
          test -n "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY}" || { echo "::error::R2_SECRET_ACCESS_KEY is not a 64-character hex Secret Access Key."; exit 1; }
          rclone sync prototype/assets/lms "r2:${BUCKET}/lms" --checksum --transfers 16 --s3-no-check-bucket --stats-one-line -v
          rclone size "r2:${BUCKET}/lms"
