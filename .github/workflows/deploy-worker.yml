name: Deploy aggregation worker

# Deploys workers/aggregate (the nightly k-anonymous aggregation and 13-month
# retention cron, and the daily lifecycle mail) with wrangler. Needs the same two repository secrets as the
# D1 migration workflow: CLOUDFLARE_API_TOKEN (Workers Scripts Edit, D1 Edit)
# and CLOUDFLARE_ACCOUNT_ID. The worker's optional ADMIN_TOKEN secret (manual
# runs over HTTP) is set by hand: cd workers/aggregate && npx wrangler secret put ADMIN_TOKEN.

on:
  push:
    branches: [main]
    paths: ['workers/aggregate/**', 'server/lib/**', '.github/workflows/deploy-worker.yml']   # the Worker bundles server/lib (lifecycle, mail, http)
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy workers/aggregate
        working-directory: workers/aggregate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | grep -oE '[0-9a-f]{32}' | head -1)"
          npx --yes wrangler@4 deploy
