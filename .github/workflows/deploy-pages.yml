name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['prototype/**', 'scripts/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap <lastmod> comes from git history
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install pillow
      - name: Build the static layer (Range directory, Mind Palace pages, sitemap, search index, OG cards)
        run: python3 scripts/build-site.py
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # The site is built for the host in prototype/CNAME (canonical URLs,
      # sitemap, social cards, the .html canonicaliser). With an Actions
      # deploy GitHub ignores that file and uses Settings → Pages → Custom
      # domain instead, so the two can drift apart — which shows up as a
      # certificate warning on one host and can become a redirect loop
      # between them. Flag it in every deploy log.
      - name: Check the Pages custom domain matches prototype/CNAME
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          want="$(tr -d '[:space:]' < prototype/CNAME)"
          echo "GitHub Pages custom domain: ${PAGES_HOST:-<none>} · site built for: ${want}"
          if [ "${PAGES_HOST}" != "${want}" ]; then
            echo "::warning title=Pages custom domain mismatch::GitHub Pages is configured for '${PAGES_HOST:-<none>}' but the site is built for '${want}' (prototype/CNAME). In the repository go to Settings → Pages → Custom domain, set it to '${want}', wait for the certificate to be issued, then tick Enforce HTTPS."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
