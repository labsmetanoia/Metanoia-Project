<!doctype html>
<!--
  Metanoia Labs lesson films: the stage.

  One 1280 x 720 page that draws a whole film from a spec (specs/*.json) and a language.
  Nothing here plays by itself: render.js calls window.seek(seconds) for every frame and
  takes a picture, so a film is the same on every run and on every machine.

  A film is a list of scenes; a scene is a list of beats. A beat is one narration line
  (shown in the lower third) and the picture that goes with it. A beat's length comes
  from its words, so the English and the Indonesian film each run at reading pace.

  Everything on screen is drawn here from shapes and the site's own fonts. No footage,
  no stock picture, no third-party clip.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:Inter;font-weight:400;src:url(../../prototype/assets/fonts/inter-400-normal-latin.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:600;src:url(../../prototype/assets/fonts/inter-600-normal-latin.woff2) format('woff2')}
  @font-face{font-family:Inter;font-weight:800;src:url(../../prototype/assets/fonts/inter-800-normal-latin.woff2) format('woff2')}
  @font-face{font-family:Caveat;font-weight:600;src:url(../../prototype/assets/fonts/caveat-600-normal-latin.woff2) format('woff2')}
  @font-face{font-family:Playfair;font-weight:600;src:url(../../prototype/assets/fonts/playfair-display-600-normal-latin.woff2) format('woff2')}
  @font-face{font-family:Playfair;font-weight:600;font-style:italic;src:url(../../prototype/assets/fonts/playfair-display-600-italic-latin.woff2) format('woff2')}
  :root{--navy:#0B1524;--navy2:#12233B;--navy3:#1B3352;--gold:#C9A84C;--gold2:#F0D878;--paper:#F4EFE4;--teal:#2FA7A0;--ember:#E07A4B;--mute:rgba(244,239,228,.62)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden;background:var(--navy);color:var(--paper);font-family:Inter,sans-serif}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(1200px 700px at 70% 0%,#16304f 0%,var(--navy) 62%)}
  .scene{position:absolute;inset:0;opacity:0}
  .kicker{font-size:17px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .serif{font-family:Playfair,Georgia,serif;font-weight:600}
  em{font-style:normal;color:var(--gold2)}
  /* lower third: the narration line of the current beat */
  #say{position:absolute;left:0;right:0;bottom:0;height:150px;padding:0 96px 34px;display:flex;align-items:flex-end;background:linear-gradient(180deg,rgba(11,21,36,0) 0%,rgba(11,21,36,.97) 36%,#0B1524 100%)}
  #say p{font-size:29px;line-height:1.36;font-weight:400;max-width:1040px;border-left:4px solid var(--gold);padding-left:20px;text-wrap:balance}
  #bar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0}
  #mark{position:absolute;right:44px;top:34px;font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
  #mark b{color:var(--gold)}
  /* title and end cards */
  .card{display:flex;flex-direction:column;justify-content:center;padding:0 110px 70px}
  .card h1{font-size:92px;line-height:1.04;margin:18px 0 16px;max-width:980px}
  .card .sub{font-size:30px;color:var(--mute)}
  .ridge{position:absolute;left:0;right:0;bottom:0;width:1280px;height:300px}
  /* story: a drawn place, a person, and a headline for the moment */
  .story svg.set{position:absolute;inset:0;width:1280px;height:720px}
  .story .tag{position:absolute;left:96px;top:92px}
  .story .key{position:absolute;left:96px;top:128px;font-size:52px;line-height:1.12;max-width:470px}
  /* split: two ideas side by side */
  .split{padding:86px 96px 0}
  .split .cols{display:flex;gap:36px;margin-top:34px}
  .split .col{flex:1;background:rgba(255,255,255,.045);border:1px solid rgba(201,168,76,.28);border-radius:22px;padding:22px 26px 26px;min-height:300px}
  .split .col h2{font-size:44px;margin:16px 0 8px}
  .split .col p{font-size:25px;line-height:1.4;color:var(--mute)}
  .split .col .vig{display:block;width:100%;height:124px;border-radius:14px;background:#0d1a2c}
  .split .foot{margin-top:28px;font-size:30px}
  /* loop: steps around a circle */
  .loop{padding:86px 96px 0}
  .loop svg{position:absolute;left:96px;top:136px;width:420px;height:420px}
  .loop .steps{position:absolute;left:572px;top:104px;width:624px;background:#F4EFE4;color:#1c2430;border-radius:14px;padding:10px 30px 12px 58px;transform:rotate(-1.2deg);box-shadow:0 22px 50px rgba(0,0,0,.45);background-image:linear-gradient(90deg,transparent 40px,rgba(224,122,75,.55) 40px,rgba(224,122,75,.55) 42px,transparent 42px)}
  .loop .step{display:flex;gap:18px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(28,36,48,.14)}
  .loop .step:last-child{border-bottom:0}
  .loop .step i{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid #9a7b22;color:#7a5f14;font-style:normal;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
  .loop .step h3{font-size:22px;font-weight:800}
  .loop .step p{font-family:Caveat,cursive;font-size:31px;font-weight:600;color:#24456b;line-height:1.02}
  /* stack: layers, one under the other */
  .stack{padding:86px 96px 0}
  .stack .lay{margin-top:30px;display:flex;flex-direction:column;gap:16px;max-width:1090px}
  .stack .layer{display:flex;gap:28px;align-items:center;background:rgba(255,255,255,.045);border:1px solid rgba(201,168,76,.28);border-left:6px solid var(--gold);border-radius:16px;padding:24px 30px;min-height:122px}
  .stack .layer b{flex:none;width:250px;font-family:Playfair,Georgia,serif;font-size:40px;font-weight:600}
  .stack .layer span{font-size:28px;line-height:1.34;color:var(--mute)}
  /* steps: cards in a row, in order */
  .steps3{padding:86px 96px 0}
  .steps3 .cards{display:flex;align-items:stretch;gap:12px;margin-top:34px}
  .steps3 .rc{flex:1;background:rgba(255,255,255,.045);border:1px solid rgba(201,168,76,.28);border-radius:20px;padding:26px 26px 30px;min-height:280px}
  .steps3 .rc.hot{background:rgba(201,168,76,.15);border-color:var(--gold)}
  .steps3 .rc .n{display:block;font-style:normal;font-weight:800;font-size:17px;letter-spacing:.2em;color:var(--gold)}
  .steps3 .rc h3{font-family:Playfair,Georgia,serif;font-weight:600;font-size:39px;line-height:1.1;margin:12px 0 12px}
  .steps3 .rc p{font-size:25px;line-height:1.38;color:var(--mute)}
  .steps3 .arr{flex:none;width:30px;align-self:center}
  .steps3 .foot{margin-top:26px;font-size:30px;max-width:1090px}
  /* quad: two by two */
  .quad{padding:76px 96px 0}
  .quad .g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;max-width:1090px}
  .quad .q{border-radius:16px;padding:18px 26px 20px;min-height:178px;background:rgba(255,255,255,.045);border:1px solid rgba(201,168,76,.28)}
  .quad .q.hot{background:rgba(201,168,76,.16);border-color:var(--gold)}
  .quad .q b{font-weight:800;font-size:15px;letter-spacing:.18em;color:var(--gold)}
  .quad .q h3{font-family:Playfair,Georgia,serif;font-weight:600;font-size:35px;margin:6px 0 6px}
  .quad .q p{font-size:25px;color:var(--mute);line-height:1.3}
  /* notes: handwritten paper notes on the wall */
  .notes{padding:86px 96px 0}
  .notes .row{display:flex;gap:44px;margin-top:40px;align-items:flex-start}
  .notes .note{position:relative;flex:1;min-height:300px;background:#F6E27A;color:#1c2430;padding:34px 34px 54px;font-family:Caveat,cursive;font-weight:600;font-size:50px;line-height:1.05;box-shadow:0 22px 44px rgba(0,0,0,.45)}
  .notes .note.n0{rotate:-2.2deg}.notes .note.n1{rotate:1.6deg;background:#F4EFE4}
  .notes .note em{color:#b0452a;font-style:normal}
  .notes .note b{position:absolute;left:34px;bottom:18px;font-family:Inter,sans-serif;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(28,36,48,.55)}
  .notes .note .strike{position:absolute;left:8%;right:8%;top:45%;height:7px;border-radius:4px;background:#b0452a;rotate:-8deg}
  /* statement: one sentence that carries the film */
  .statement{display:flex;flex-direction:column;justify-content:center;padding:0 110px 120px}
  .statement p{font-size:66px;line-height:1.16;max-width:1040px;margin:10px 0}
  /* recap */
  .recap{padding:86px 96px 0}
  .recap ul{list-style:none;margin-top:30px}
  .recap li{font-size:36px;line-height:1.25;padding:20px 0 20px 54px;position:relative;border-bottom:1px solid rgba(255,255,255,.08);max-width:1040px}
  .recap li:before{content:"";position:absolute;left:6px;top:36px;width:22px;height:4px;background:var(--gold)}
  .recap .turn{margin-top:30px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.5);border-radius:18px;padding:22px 28px;font-size:30px;max-width:1040px}
  .recap .turn b{color:var(--gold2)}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="mark"></div>
  <div id="say"><p></p></div>
  <div id="bar"></div>
</div>
<script>
(function () {
  'use strict';
  var FILM = null, LANG = 'en', SCENES = [], TOTAL = 0;
  var FADE = 0.45;                                   /* seconds a scene takes to arrive and to leave */
  var t = function (x) { return x == null ? '' : (typeof x === 'string' ? x : (x[LANG] || x.en || '')); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  /* *word* marks the words that carry the point */
  var rich = function (s) { return esc(t(s)).replace(/\*([^*]+)\*/g, '<em>$1</em>'); };
  var plain = function (s) { return t(s).replace(/\*/g, ''); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var ease = function (x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
  /* reading pace: a short line still gets time to land, a long one is not left hanging */
  function beatSeconds(line) { var w = plain(line).split(/\s+/).filter(Boolean).length; return clamp(1.3 + w / 2.5, 3, 9); }

  /* ── drawn places and people ── */
  var RIDGE = '<svg class="ridge" viewBox="0 0 1280 300" preserveAspectRatio="none"><path d="M0 300 L0 210 L150 150 L260 190 L400 90 L520 170 L640 60 L760 160 L880 110 L1010 190 L1130 130 L1280 200 L1280 300 Z" fill="#0f2038"/><path class="draw" d="M0 210 L150 150 L260 190 L400 90 L520 170 L640 60 L760 160 L880 110 L1010 190 L1130 130 L1280 200" fill="none" stroke="#C9A84C" stroke-width="2.5" stroke-linejoin="round"/><path d="M0 300 L0 250 L200 215 L420 255 L640 200 L900 250 L1100 215 L1280 245 L1280 300 Z" fill="#0a1626"/></svg>';
  var SKIN = '#E9BE96', INK = '#1c2430', UID = 0;
  function face(mood) {
    var eyes = '<circle cx="-12" cy="30" r="3.4" fill="' + INK + '"/><circle cx="13" cy="30" r="3.4" fill="' + INK + '"/>';
    var line = function (d) { return '<path d="' + d + '" stroke="' + INK + '" stroke-width="3" fill="none" stroke-linecap="round"/>'; };
    if (mood === 'down') return line('M-17 32 q6 4 12 0 M7 32 q6 4 12 0') + line('M-9 51 q9 -6 18 0');
    if (mood === 'smile') return eyes + line('M-11 45 q11 11 22 0');
    if (mood === 'surprised') return eyes + line('M-19 18 q7 -5 13 -1 M7 17 q7 -4 13 1') + '<ellipse cx="0" cy="49" rx="5" ry="6.5" fill="' + INK + '"/>';
    if (mood === 'think') return '<circle cx="-10" cy="27" r="3.4" fill="' + INK + '"/><circle cx="15" cy="27" r="3.4" fill="' + INK + '"/>' + line('M-6 48 h13');
    return eyes + line('M-8 47 q8 3 16 0');
  }
  /* A figure made of a few shapes: enough to read as a person, plain enough to belong to nobody.
     o.moods gives one expression per beat, so a face can change as the story moves. */
  function person(x, y, s, o) {
    o = o || {};
    var shirt = o.shirt || '#2FA7A0', moods = o.moods || [o.mood || 'neutral'];
    var faces = moods.map(function (m, i) { return '<g' + (moods.length > 1 ? ' data-beat="' + i + '"' + (i < moods.length - 1 ? ' data-until="' + (i + 1) + '"' : '') : '') + '>' + face(m) + '</g>'; }).join('');
    var head = o.hair === 'hijab'
      ? '<path d="M-50 30 C-54 -30 -22 -50 2 -50 C30 -50 54 -28 50 30 C48 62 60 86 80 104 L-80 104 C-60 86 -48 62 -50 30 Z" fill="' + (o.scarf || '#C9A84C') + '"/><ellipse cx="0" cy="30" rx="31" ry="35" fill="' + SKIN + '"/>'
      : '<rect x="-13" y="52" width="26" height="36" rx="10" fill="#E2B48C"/><circle cx="0" cy="26" r="40" fill="' + SKIN + '"/>' +
        (o.hair === 'short' ? '<path d="M-41 18 C-44 -20 -18 -42 4 -41 C32 -40 46 -16 41 18 C36 -2 24 -12 2 -12 C-18 -12 -34 -4 -41 18 Z" fill="' + INK + '"/>'
          : '<path d="M-44 46 C-52 -18 -22 -46 4 -44 C36 -42 52 -14 44 46 C44 18 32 -6 2 -6 C-24 -6 -42 14 -44 46 Z" fill="' + INK + '"/>');
    var arm = '';
    if (o.arm === 'raise') arm = '<path d="M56 122 C86 98 92 62 88 36" stroke="' + shirt + '" stroke-width="26" fill="none" stroke-linecap="round"/><circle cx="88" cy="22" r="14" fill="' + SKIN + '"/>';
    if (o.arm === 'point') arm = '<path d="M-56 126 C-96 114 -120 98 -140 86" stroke="' + shirt + '" stroke-width="26" fill="none" stroke-linecap="round"/><circle cx="-152" cy="81" r="14" fill="' + SKIN + '"/>';
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path d="M-74 190 C-74 110 -40 78 0 78 C40 78 74 110 74 190 Z" fill="' + shirt + '"/>' + arm + head + faces + '</g>';
  }
  function win(x, y, w, h, sky) {
    var id = 'w' + (++UID), sun = sky === 'sun', rain = '';
    if (!sun) for (var i = 0; i < 26; i++) rain += '<line class="rain" data-i="' + i + '" data-x="' + x + '" data-y="' + y + '" data-w="' + w + '" data-h="' + h + '" x1="0" y1="0" x2="-7" y2="26" stroke="rgba(190,214,240,.5)" stroke-width="2" stroke-linecap="round"/>';
    return '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + (sun ? '#f3c66b' : '#1a3a5c') + '"/><stop offset="1" stop-color="' + (sun ? '#e7915a' : '#132842') + '"/></linearGradient><clipPath id="' + id + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6"/></clipPath></defs>' +
      '<g clip-path="url(#' + id + ')"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="url(#g' + id + ')"/>' +
      (sun ? '<circle cx="' + (x + w * 0.7) + '" cy="' + (y + h * 0.42) + '" r="78" fill="rgba(255,243,196,.35)"/><circle cx="' + (x + w * 0.7) + '" cy="' + (y + h * 0.42) + '" r="44" fill="#fff3c4"/>' : '<circle cx="' + (x + w * 0.8) + '" cy="' + (y + h * 0.25) + '" r="32" fill="rgba(240,216,120,.16)"/>') +
      '<path d="M' + x + ' ' + (y + h) + ' v-' + (h * 0.28) + ' l' + (w * 0.2) + ' -' + (h * 0.2) + ' l' + (w * 0.15) + ' ' + (h * 0.14) + ' l' + (w * 0.2) + ' -' + (h * 0.26) + ' l' + (w * 0.2) + ' ' + (h * 0.22) + ' l' + (w * 0.25) + ' -' + (h * 0.14) + ' v' + (h * 0.32) + ' Z" fill="' + (sun ? 'rgba(122,74,58,.6)' : '#0f2238') + '"/>' + rain + '</g>' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" fill="none" stroke="#27456b" stroke-width="7"/><line x1="' + (x + w / 2) + '" y1="' + y + '" x2="' + (x + w / 2) + '" y2="' + (y + h) + '" stroke="#27456b" stroke-width="6"/><line x1="' + x + '" y1="' + (y + h / 2) + '" x2="' + (x + w) + '" y2="' + (y + h / 2) + '" stroke="#27456b" stroke-width="6"/>';
  }
  function deskTop(x, y, w) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="26" rx="6" fill="#4a3526"/><rect x="' + x + '" y="' + (y + 26) + '" width="' + w + '" height="200" fill="#2f2118"/>'; }
  function laptop(x, y, inner) {
    return '<rect x="' + x + '" y="' + (y - 112) + '" width="250" height="112" rx="8" fill="#1d2b3f" stroke="#33485f" stroke-width="4"/><rect x="' + (x + 12) + '" y="' + (y - 100) + '" width="226" height="88" rx="4" fill="#9cc4e8"/><g transform="translate(' + (x + 12) + ' ' + (y - 100) + ')">' + (inner || '') + '</g><rect x="' + (x - 26) + '" y="' + y + '" width="302" height="10" rx="5" fill="#33485f"/>';
  }
  var MAIL = '<rect x="20" y="16" width="186" height="56" rx="6" fill="#fff"/><rect x="32" y="28" width="92" height="8" rx="4" fill="#E07A4B"/><rect x="32" y="44" width="150" height="6" rx="3" fill="#c8d0da"/><rect x="32" y="56" width="118" height="6" rx="3" fill="#c8d0da"/>';
  var QUIZ = '<rect x="14" y="10" width="198" height="68" rx="6" fill="#fff"/><rect x="26" y="20" width="130" height="7" rx="3" fill="#5b7696"/>' + [0, 1, 2].map(function (i) { return '<circle cx="32" cy="' + (40 + i * 13) + '" r="4" fill="' + (i === 1 ? '#2FA7A0' : 'none') + '" stroke="#5b7696" stroke-width="2"/><rect x="44" y="' + (37 + i * 13) + '" width="' + (90 - i * 16) + '" height="6" rx="3" fill="#c8d0da"/>'; }).join('') + '<rect x="160" y="60" width="42" height="8" rx="4" fill="#C9A84C"/>';
  var CHART = '<rect x="14" y="10" width="198" height="68" rx="6" fill="#fff"/>' + [22, 34, 30, 46, 54].map(function (h, i) { return '<rect x="' + (30 + i * 36) + '" y="' + (70 - h) + '" width="22" height="' + h + '" rx="3" fill="' + (i === 4 ? '#C9A84C' : '#2FA7A0') + '"/>'; }).join('');
  /* a paper note on the wall, in handwriting; `fade` is the beat on which it pales */
  function sticky(x, y, text, fade) { return '<g transform="rotate(-4 ' + x + ' ' + y + ')"><rect x="' + x + '" y="' + y + '" width="190" height="170" fill="#F6E27A"/><rect x="' + (x + 70) + '" y="' + (y - 12) + '" width="50" height="24" fill="rgba(244,239,228,.55)"/><foreignObject x="' + (x + 12) + '" y="' + (y + 14) + '" width="168" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Caveat,cursive;font-weight:600;font-size:27px;line-height:1.05;color:#1c2430">' + esc(text) + '</div></foreignObject>' + (fade == null ? '' : '<rect data-beat="' + fade + '" x="' + x + '" y="' + y + '" width="190" height="170" fill="rgba(13,26,44,.55)"/>') + '</g>'; }
  function mug(x, y) { return '<rect x="' + x + '" y="' + (y - 44) + '" width="38" height="44" rx="7" fill="#f4efe4"/><path d="M' + (x + 38) + ' ' + (y - 34) + ' q18 2 16 14 q-2 10 -16 8" fill="none" stroke="#f4efe4" stroke-width="6"/><path class="steam" d="M' + (x + 12) + ' ' + (y - 54) + ' q-8 -12 0 -22 q8 -10 0 -22 M' + (x + 26) + ' ' + (y - 54) + ' q-8 -12 0 -22 q8 -10 0 -22" fill="none" stroke="rgba(244,239,228,.5)" stroke-width="4" stroke-linecap="round"/>'; }
  function plant(x, y) { return '<path d="M' + x + ' ' + y + ' q-34 -40 -18 -84 q22 30 18 84 M' + x + ' ' + y + ' q30 -44 8 -96 q-18 36 -8 96 M' + x + ' ' + y + ' q44 -24 60 -66 q-40 12 -60 66" fill="#2f8f6b"/><path d="M' + (x - 26) + ' ' + y + ' h52 l-7 44 h-38 z" fill="#b5653f"/>'; }
  function calendar(x, y, top, big) { return '<rect x="' + x + '" y="' + y + '" width="92" height="100" rx="8" fill="#f4efe4"/><path d="M' + x + ' ' + (y + 30) + ' v-22 a8 8 0 0 1 8 -8 h76 a8 8 0 0 1 8 8 v22 z" fill="#E07A4B"/><text x="' + (x + 46) + '" y="' + (y + 21) + '" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="#fff">' + esc(top) + '</text><text x="' + (x + 46) + '" y="' + (y + 80) + '" text-anchor="middle" font-family="Playfair" font-weight="600" font-size="44" fill="#1c2430">' + esc(big) + '</text>'; }
  function phone(x, y, txt) { return '<g transform="rotate(-8 ' + x + ' ' + y + ')"><rect x="' + x + '" y="' + (y - 98) + '" width="58" height="98" rx="9" fill="#0f1c2e" stroke="#5b7696" stroke-width="3"/><text x="' + (x + 29) + '" y="' + (y - 42) + '" text-anchor="middle" font-family="Inter" font-weight="800" font-size="16" fill="#F0D878">' + esc(txt) + '</text></g>'; }
  /* the left of a place stays dark, so the headline can be read on it */
  var SHADE = '<defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1524" stop-opacity=".97"/><stop offset=".4" stop-color="#0B1524" stop-opacity=".86"/><stop offset=".56" stop-color="#0B1524" stop-opacity="0"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sh)"/>';
  var svg = function (inner) { return '<svg class="set" viewBox="0 0 1280 720">' + inner + SHADE + '</svg>'; };
  var SETS = {
    /* a desk by a window: rain on a bad morning, sun on a better one */
    desk: function (o) {

      return svg('<rect width="1280" height="720" fill="' + (sun ? '#1d3350' : '#0d1a2c') + '"/>' + (sun ? '<path d="M700 70 L1130 70 L1290 560 L520 560 Z" fill="rgba(243,198,107,.09)"/>' : '') +
        win(700, 70, 430, 330, o.sky) + calendar(1150, 96, t(o.day), o.date || '') + deskTop(520, 520, 760) + plant(1204, 520) + mug(650, 520) +
        laptop(726, 520, o.mail != null ? '<g data-beat="' + o.mail + '">' + MAIL + '</g>' : (o.quiz ? QUIZ : (o.chart ? CHART : ''))) + (o.note ? sticky(606, 150, t(o.note), o.noteFade) : '') +
        (o.phone ? phone(1104, 520, o.phone) : '') + person(1010, 420, 1.12, Object.assign({ moods: o.moods }, o.who || {})));
    },
    /* the team room: a wall screen that changes from the old tool to the new one */

        '<rect x="650" y="82" width="420" height="240" rx="12" fill="#0f1c2e" stroke="#33485f" stroke-width="6"/>' +
        (sw == null ? '' : '<g data-beat="0" data-until="' + sw + '">' + grid + '</g>') +
        '<g data-beat="' + (sw == null ? 0 : sw) + '">' + bars + '<path d="M690 300 h350" stroke="#33485f" stroke-width="3"/><rect x="960" y="98" width="92" height="30" rx="15" fill="#E07A4B"/><text x="1006" y="119" text-anchor="middle" font-family="Inter" font-weight="800" font-size="15" fill="#fff">' + esc(t(o.badge)) + '</text></g>' +
        '<rect x="1110" y="150" width="130" height="170" rx="8" fill="rgba(244,239,228,.06)"/>' + plant(600, 520) + deskTop(520, 520, 760) +
        person(1170, 372, 1.08, { shirt: '#E07A4B', hair: 'short', arm: o.lead === 'laras' ? null : 'point', mood: o.leadMood || 'neutral' }) +

    /* two people at one screen: asking for a quarter of an hour */

        deskTop(520, 520, 760) + mug(1196, 520) +
        '<rect x="770" y="372" width="300" height="148" rx="8" fill="#1d2b3f" stroke="#33485f" stroke-width="4"/><rect x="782" y="384" width="276" height="124" rx="4" fill="#0f1c2e"/>' +
        [0, 1, 2, 3, 4].map(function (i) { return '<rect class="bar" data-i="' + i + '" x="' + (802 + i * 50) + '" y="496" width="30" height="0" rx="4" fill="' + (i === 4 ? '#F0D878' : '#2FA7A0') + '"/>'; }).join('') +
        '<rect x="740" y="520" width="360" height="10" rx="5" fill="#33485f"/>' +
        person(716, 420, 1.12, Object.assign({ moods: o.moods }, o.who || {})) + person(1150, 426, 1.06, { shirt: '#E07A4B', hair: 'short', mood: 'smile', arm: 'point' }));

  };
  function week(fill) {

    }

  }
  /* small drawings for the two ideas side by side */
  var VIGS = {
    weekfull: week('all'), weekthree: week('three'),

    /* a trail that meets a rockfall and goes round it */
    turn: '<svg class="vig" viewBox="0 0 480 130"><path d="M0 130 L0 96 L120 60 L220 92 L330 40 L480 84 L480 130 Z" fill="#12233B"/><path d="M20 112 H170" stroke="rgba(244,239,228,.35)" stroke-width="5" stroke-dasharray="3 13" stroke-linecap="round"/><path d="M196 122 l20 -34 l26 12 l18 -20 l24 42 z" fill="#5b7696"/><path d="M170 112 C190 112 186 62 236 56 C290 50 300 108 340 112 H430" fill="none" stroke="#F0D878" stroke-width="5" stroke-dasharray="3 13" stroke-linecap="round"/><path d="M436 112 v-40 l26 10 l-26 10" fill="#E07A4B" stroke="#E07A4B" stroke-width="3" stroke-linejoin="round"/></svg>',
    /* a camp for the night: rest, then on */
    charge: '<svg class="vig" viewBox="0 0 480 130"><path d="M0 130 L0 100 L140 70 L260 100 L380 56 L480 90 L480 130 Z" fill="#12233B"/><circle cx="400" cy="30" r="16" fill="rgba(240,216,120,.5)"/><path d="M110 118 l60 -74 l60 74 z" fill="#2FA7A0"/><path d="M170 44 l0 74 l-22 0 z" fill="#1f7f7a"/><path d="M290 118 q-12 -22 6 -40 q2 16 14 18 q-4 -18 8 -30 q16 22 6 52 z" fill="#E07A4B"/><path d="M300 118 q-4 -10 4 -18 q8 8 4 18 z" fill="#F0D878"/><path d="M270 120 h64" stroke="#4a3526" stroke-width="7" stroke-linecap="round"/><rect x="24" y="24" width="64" height="26" rx="6" fill="none" stroke="#F0D878" stroke-width="3"/><rect x="90" y="32" width="5" height="10" rx="2" fill="#F0D878"/><rect x="29" y="29" width="40" height="16" rx="3" fill="#2FA7A0"/></svg>'
  };

  /* ── scene builders: each returns markup; elements with data-beat arrive on that beat ── */
  var BUILD = {
    title: function (s) { return '<div class="scene card"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><h1 class="serif" data-beat="0" data-delay=".25">' + rich(s.title) + '</h1><div class="sub" data-beat="0" data-delay=".6">' + esc(t(s.sub)) + '</div>' + RIDGE + '</div>'; },
    end: function (s) { return '<div class="scene card"><div class="kicker" data-beat="0">Metanoia Labs</div><h1 class="serif" data-beat="0" data-delay=".25" style="font-size:64px">' + rich(s.title) + '</h1><div class="sub" data-beat="0" data-delay=".6">' + esc(t(s.sub)) + '</div>' + RIDGE + '</div>'; },
    story: function (s) {
      var keys = (s.keys || []).map(function (k, i) { return k ? '<div class="key serif" data-beat="' + i + '" data-until="' + (i + 1) + '">' + rich(k) + '</div>' : ''; }).join('');
      return '<div class="scene story">' + SETS[s.set](s.opts || {}) + '<div class="tag kicker" data-beat="0">' + esc(t(s.tag)) + '</div>' + keys + '</div>';
    },
    split: function (s) {
      return '<div class="scene split"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><div class="cols">' + s.cols.map(function (c, i) {
        return '<div class="col" data-beat="' + i + '">' + VIGS[c.vig] + '<h2 class="serif">' + rich(c.h) + '</h2><p>' + rich(c.p) + '</p></div>';
      }).join('') + '</div><div class="foot serif" data-beat="' + s.cols.length + '">' + rich(s.foot) + '</div></div>';
    },
    loop: function (s) {
      var n = s.steps.length, R = 150, C = 210, svg = '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="rgba(201,168,76,.22)" stroke-width="3"/><circle class="arc" cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="#C9A84C" stroke-width="6" stroke-linecap="round" transform="rotate(-90 ' + C + ' ' + C + ')"/>';
      s.steps.forEach(function (st, i) { var a = -Math.PI / 2 + i * 2 * Math.PI / n, x = C + R * Math.cos(a), y = C + R * Math.sin(a); svg += '<g class="node" data-node="' + i + '"><circle cx="' + x + '" cy="' + y + '" r="34" fill="#0B1524" stroke="#C9A84C" stroke-width="3"/><text x="' + x + '" y="' + (y + 9) + '" text-anchor="middle" font-size="26" font-weight="800" fill="#F0D878" font-family="Inter">' + (i + 1) + '</text></g>'; });
      svg += '<text x="' + C + '" y="' + (C - 4) + '" text-anchor="middle" font-size="27" fill="#F4EFE4" font-family="Playfair" font-weight="600">' + esc(t(s.centre)) + '</text><text x="' + C + '" y="' + (C + 28) + '" text-anchor="middle" font-size="18" fill="rgba(244,239,228,.62)" font-family="Inter">' + esc(t(s.centreSub)) + '</text>';
      return '<div class="scene loop"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><svg viewBox="0 0 420 420" data-beat="0">' + svg + '</svg><div class="steps">' + s.steps.map(function (st, i) {
        return '<div class="step" data-beat="' + (i + 1) + '"><i>' + (i + 1) + '</i><div><h3>' + rich(st.h) + '</h3><p>' + rich(st.p) + '</p></div></div>';
      }).join('') + '</div></div>';
    },
    stack: function (s) {
      return '<div class="scene stack"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><div class="lay">' + s.layers.map(function (c, i) {
        return '<div class="layer" data-beat="' + (c.at != null ? c.at : i + 1) + '"><b>' + rich(c.h) + '</b><span>' + rich(c.p) + '</span></div>';
      }).join('') + '</div></div>';
    },
    steps: function (s) {
      var arrow = '<svg viewBox="0 0 30 30"><path d="M8 5 l12 10 l-12 10" fill="none" stroke="#C9A84C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return '<div class="scene steps3"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><div class="cards">' + s.cards.map(function (c, i) {
        var at = c.at != null ? c.at : i;
        return (i ? '<div class="arr" data-beat="' + at + '">' + arrow + '</div>' : '') + '<div class="rc' + (c.hot ? ' hot' : '') + '" data-beat="' + at + '"><i class="n">' + (i + 1) + '</i><h3>' + rich(c.h) + '</h3><p>' + rich(c.p) + '</p></div>';
      }).join('') + '</div>' + (s.foot ? '<div class="foot serif" data-beat="' + (s.footAt != null ? s.footAt : s.cards.length) + '">' + rich(s.foot) + '</div>' : '') + '</div>';
    },
    quad: function (s) {
      return '<div class="scene quad"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><div class="g">' + s.boxes.map(function (c, i) {
        return '<div class="q' + (c.hot ? ' hot' : '') + '" data-beat="' + (c.at != null ? c.at : i) + '"><b>' + ['I', 'II', 'III', 'IV'][i] + '</b><h3>' + rich(c.h) + '</h3><p>' + rich(c.p) + '</p></div>';
      }).join('') + '</div></div>';
    },
    notes: function (s) {
      return '<div class="scene notes"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><div class="row">' + s.notes.map(function (n, i) {
        return '<div class="note n' + i + '" data-beat="' + (n.at || 0) + '"><span>' + rich(n.text) + '</span>' + (n.strikeAt != null ? '<i class="strike" data-beat="' + n.strikeAt + '"></i>' : '') + (n.label ? '<b>' + esc(t(n.label)) + '</b>' : '') + '</div>';
      }).join('') + '</div></div>';
    },
    statement: function (s) { return '<div class="scene statement"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div>' + s.lines.map(function (l, i) { return '<p class="serif" data-beat="' + i + '">' + rich(l) + '</p>'; }).join('') + '</div>'; },
    recap: function (s) {
      return '<div class="scene recap"><div class="kicker" data-beat="0">' + esc(t(s.kicker)) + '</div><ul>' + s.points.map(function (p, i) { return '<li class="serif" data-beat="' + i + '">' + rich(p) + '</li>'; }).join('') + '</ul><div class="turn" data-beat="' + s.points.length + '"><b>' + esc(t(s.turnLabel)) + '</b> ' + rich(s.turn) + '</div></div>';
    }
  };

  function load(film, lang) {
    FILM = film; LANG = lang === 'id' ? 'id' : 'en'; SCENES = []; TOTAL = 0; UID = 0;
    document.documentElement.lang = LANG;
    var host = document.getElementById('scenes'); host.innerHTML = '';
    film.scenes.forEach(function (s) {
      var wrap = document.createElement('div'); wrap.innerHTML = BUILD[s.type](s);
      var el = wrap.firstChild; host.appendChild(el);
      var beats = [], at = 0;
      (s.say && s.say.length ? s.say : [null]).forEach(function (line) {
        var d = line ? beatSeconds(line) : (s.hold || 4);
        beats.push({ at: at, d: d, line: line }); at += d;
      });
      SCENES.push({ el: el, spec: s, start: TOTAL, d: at, beats: beats });
      TOTAL += at;
    });
    document.getElementById('mark').innerHTML = '<b>Metanoia Labs</b> · ' + esc(t(film.product)) + ' ' + esc(film.lesson || '');
    return { seconds: TOTAL, cues: cues() };
  }
  /* the narration lines with their times: the caption file and the script are written from this */
  function cues() {
    var out = [];
    SCENES.forEach(function (sc) { sc.beats.forEach(function (b) { if (b.line) out.push({ start: sc.start + b.at, end: sc.start + b.at + b.d, text: plain(b.line) }); }); });
    return out;
  }
  function seek(time) {
    var say = document.querySelector('#say p'), shown = false;
    SCENES.forEach(function (sc) {
      var lt = time - sc.start;
      if (lt < 0 || lt >= sc.d) { sc.el.style.opacity = 0; return; }
      sc.el.style.opacity = Math.min(ease(lt / FADE), ease((sc.d - lt) / FADE));
      var bi = 0; sc.beats.forEach(function (b, i) { if (lt >= b.at) bi = i; });
      var beat = sc.beats[bi], bt = lt - beat.at;
      /* elements arrive on their beat, and leave on data-until */
      sc.el.querySelectorAll('[data-beat]').forEach(function (el) {
        var b = +el.getAttribute('data-beat'), until = el.getAttribute('data-until'), delay = +(el.getAttribute('data-delay') || 0);
        if (!sc.beats[b]) { el.style.opacity = 0; return; }
        var e = ease((lt - sc.beats[b].at - delay) / 0.7), out = 1;
        if (until != null && sc.beats[+until]) out = 1 - ease((lt - sc.beats[+until].at + 0.3) / 0.3);
        el.style.opacity = e * out;
        if (el.namespaceURI === 'http://www.w3.org/1999/xhtml') el.style.transform = 'translateY(' + ((1 - e) * 18) + 'px)';
      });
      /* a slow drift keeps a drawn place alive */
      var set = sc.el.querySelector('svg.set'); if (set) set.style.transform = 'scale(' + (1.03 + 0.02 * lt / sc.d) + ') translateX(' + (-6 * lt / sc.d) + 'px)';
      sc.el.querySelectorAll('.rain').forEach(function (r) { var i = +r.getAttribute('data-i'), sp = 260 + (i % 5) * 40, x = +r.getAttribute('data-x') + 10 + (i * 53) % (+r.getAttribute('data-w') - 10), y = +r.getAttribute('data-y') - 30 + (i * 97 + time * sp) % (+r.getAttribute('data-h') + 40); r.setAttribute('transform', 'translate(' + x + ' ' + y + ')'); });
      sc.el.querySelectorAll('.steam').forEach(function (p) { p.style.opacity = 0.45 + 0.4 * Math.sin(time * 1.7); p.style.transform = 'translateY(' + (-3 * Math.sin(time * 1.1)) + 'px)'; });
      sc.el.querySelectorAll('.bar').forEach(function (r) { var i = +r.getAttribute('data-i'), h = [38, 62, 50, 78, 96][i] * ease((lt - 1.2 - i * 0.35) / 0.9); r.setAttribute('height', h); r.setAttribute('y', 496 - h); });
      sc.el.querySelectorAll('.draw').forEach(function (p) { var L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - ease(lt / 2.4)); });
      var arc = sc.el.querySelector('.arc');
      if (arc) {
        var n = sc.spec.steps.length, L2 = 2 * Math.PI * 150, done = bi === 0 ? 0 : ((bi - 1) + ease(bt / 1.1)) / n;
        arc.style.strokeDasharray = L2; arc.style.strokeDashoffset = L2 * (1 - clamp(done, 0, 1));
        sc.el.querySelectorAll('.node').forEach(function (g) { var i = +g.getAttribute('data-node'), on = bi - 1 === i; g.querySelector('circle').setAttribute('fill', on ? '#C9A84C' : '#0B1524'); g.querySelector('text').setAttribute('fill', on ? '#0B1524' : '#F0D878'); });
        sc.el.querySelectorAll('.step').forEach(function (st, i) { st.style.filter = bi - 1 === i || bi === 0 ? 'none' : 'opacity(.62)'; });
      }
      /* a quiet scene already shows its words large: the line is kept for the captions, not repeated below */
      if (beat.line && !sc.spec.quiet) { shown = true; say.textContent = plain(beat.line); say.style.opacity = Math.min(ease(bt / 0.35), ease((beat.d - bt) / 0.25)); }
    });
    if (!shown) say.style.opacity = 0;
    document.getElementById('say').style.opacity = shown ? 1 : 0;
    document.getElementById('bar').style.width = (1280 * clamp(time / TOTAL, 0, 1)) + 'px';
  }
  window.film = { load: load, seek: seek };
})();
