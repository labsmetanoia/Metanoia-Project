<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Range (Bentang) — Metanoia Labs</title>
<meta name="description" content="The Range — see what's out there, then find out what it takes. Career exploration and opportunity intelligence for Indonesia. Free to start, no account needed.">
<meta property="og:title" content="The Range — Metanoia Labs">
<meta property="og:description" content="See what's out there. Then find out what it takes.">
<link rel="icon" type="image/svg+xml" href="../../assets/logo-mark.svg">
<style>
/* ═══ THE RANGE — "Quiet Dark" ═══
   Solid surfaces, one border, no blur, no gradients, no card shadows.
   Blue = exploring; gold = committing, and nothing else. */
:root{
  --r-bg:#06090F; --r-surface:#0C121C; --r-raised:#131A26; --r-line:#1C2530; --r-line2:#2A3542;
  --r-text:#E8EAED; --r-text-2:#9AA4B2; --r-text-3:#626C7A;
  --r-explore:#7BA5C4; --r-commit:#C9A84C;
  --r-for:#6FBF8F; --r-against:#D98B6A; --r-unknown:#626C7A;
  --r-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-serif:'Newsreader','Source Serif 4',Georgia,serif;
  --r-fast:120ms; --r-base:200ms; --r-slow:280ms; --r-ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--r-bg);color:var(--r-text);font-family:var(--r-sans);font-size:15px;line-height:1.65;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
h1,h2,h3,h4{line-height:1.25;font-weight:600}
::selection{background:rgba(123,165,196,.3)}

/* ── shell: left rail (desktop) / bottom bar (mobile) ── */
.shell{display:flex;min-height:100vh}
.rail{width:240px;flex:none;border-right:1px solid var(--r-line);padding:20px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.rail .lockup{display:flex;align-items:center;gap:9px;text-decoration:none;padding:6px 10px;margin-bottom:14px}
.rail .lm{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--r-commit);display:flex;
  align-items:center;justify-content:center;color:var(--r-commit);font-weight:700;font-size:12px}
.rail .lk b{font-size:12px;letter-spacing:.2em;font-weight:700;display:block}
.rail .lk i{font-style:normal;font-size:8.5px;letter-spacing:.28em;color:var(--r-text-3)}
.rail .prod{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--r-explore);
  padding:0 10px 14px;border-bottom:1px solid var(--r-line);margin-bottom:12px}
.nav-it{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:8px;border:none;
  background:none;font-size:13.5px;font-weight:500;color:var(--r-text-2);text-align:left;width:100%;
  transition:background var(--r-fast) var(--r-ease),color var(--r-fast) var(--r-ease)}
.nav-it svg{width:16px;height:16px;flex:none}
.nav-it:hover{background:var(--r-raised);color:var(--r-text)}
.nav-it.on{background:var(--r-raised);color:var(--r-text)}
.nav-it .cnt{margin-left:auto;font-size:11px;color:var(--r-text-3)}
.rail .srch{margin-top:auto;display:flex;align-items:center;gap:9px;border:1px solid var(--r-line);
  border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--r-text-3);background:none;width:100%}
.rail .srch kbd{margin-left:auto;font-size:10px;border:1px solid var(--r-line);border-radius:4px;padding:1px 5px}
.rail .lang{display:flex;border:1px solid var(--r-line);border-radius:8px;overflow:hidden;margin-top:10px}
.rail .lang button{flex:1;background:none;border:none;font-size:11px;font-weight:600;padding:7px;color:var(--r-text-3)}
.rail .lang button.on{background:var(--r-raised);color:var(--r-text)}

.main{flex:1;min-width:0;padding:40px clamp(18px,4vw,48px) 120px;max-width:1200px}
.view{display:none}
.view.on{display:block;animation:vin var(--r-slow) var(--r-ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* mobile bottom bar */
.bbar{display:none}
@media(max-width:860px){
  .rail{display:none}
  .main{padding:22px 16px 130px}
  .bbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--r-surface);
    border-top:1px solid var(--r-line)}
  .bbar button{flex:1;background:none;border:none;padding:9px 4px 10px;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--r-text-3);min-height:52px}
  .bbar button.on{color:var(--r-explore)}
  .bbar svg{width:18px;height:18px}
}

/* ── atoms ── */
.micro{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--r-text-3);font-weight:600}
.card{background:var(--r-surface);border:1px solid var(--r-line);border-radius:10px;padding:20px;
  transition:border-color var(--r-fast) var(--r-ease)}
.card:hover{border-color:var(--r-line2)}
.card--committed{border-left:2px solid var(--r-commit)}
.btn-p{background:var(--r-commit);color:#06090F;border:none;border-radius:8px;font-weight:700;
  font-size:13.5px;padding:12px 22px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  transition:opacity var(--r-fast)}
.btn-p:hover{opacity:.92}
.btn-s{background:transparent;border:1px solid var(--r-line);border-radius:8px;color:var(--r-text);
  font-weight:600;font-size:13px;padding:11px 18px;display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;transition:border-color var(--r-fast)}
.btn-s:hover{border-color:var(--r-line2)}
.btn-s.explore{color:var(--r-explore);border-color:rgba(123,165,196,.35)}
.btn-q{background:none;border:none;color:var(--r-text-2);font-size:12.5px;font-weight:500;padding:8px 4px}
.btn-q:hover{color:var(--r-text)}
.serif{font-family:var(--r-serif);font-weight:400}
.band{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.band .dot{width:7px;height:7px;border-radius:50%}
.band.strong .dot{background:var(--r-for)} .band.strong{color:var(--r-for)}
.band.worth .dot{background:var(--r-explore)} .band.worth{color:var(--r-explore)}
.band.stretch .dot{background:var(--r-against)} .band.stretch{color:var(--r-against)}
.band.unex{color:var(--r-explore)}
.prov{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--r-text-3);font-weight:500}
.prov.v{color:var(--r-for)} .prov.c{color:var(--r-explore)} .prov.i{color:var(--r-text-3)} .prov.u{color:var(--r-unknown)}
.ev-row{display:flex;gap:10px;padding:7px 0;font-size:13.5px;line-height:1.6;color:var(--r-text-2)}
.ev-row .m{flex:none;font-weight:700;width:16px}
.ev-row.for .m{color:var(--r-for)}
.ev-row.against .m{color:var(--r-against)}
.ev-row .src{display:block;font-size:11px;color:var(--r-text-3)}
.disc{border:1px solid var(--r-line);border-radius:10px;padding:14px 16px;font-size:12px;
  color:var(--r-text-3);line-height:1.65;margin-top:28px}
.note3{font-size:12px;color:var(--r-text-3);line-height:1.6}
.h-page{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.015em;margin:0 0 6px}
.h-sub{font-size:13.5px;color:var(--r-text-2);margin:0 0 26px}
.sec{margin-top:64px}
.sec-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--r-text-3);
  font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--r-line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.empty{border:1px dashed var(--r-line);border-radius:10px;padding:28px 22px;text-align:center;
  color:var(--r-text-2);font-size:13.5px;line-height:1.7}
.fieldl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--r-text-3);margin:0 0 6px}
select,input[type=text],input[type=number],textarea{width:100%;background:var(--r-raised);
  border:1px solid var(--r-line);border-radius:8px;color:var(--r-text);font-size:13.5px;padding:11px 13px;
  font-family:inherit;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--r-explore)}
textarea{min-height:80px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--r-line);border-radius:8px;background:none;color:var(--r-text-2);
  font-size:13px;font-weight:500;padding:10px 15px;min-height:44px;transition:all var(--r-fast)}
.tag.on{border-color:var(--r-explore);color:var(--r-explore);background:rgba(123,165,196,.08)}
input[type=range]{width:100%;accent-color:var(--r-explore);height:32px}
.meter{height:6px;border-radius:3px;background:var(--r-raised);overflow:hidden}
.meter i{display:block;height:100%;background:var(--r-explore);transition:width 400ms var(--r-ease)}
.stage{display:flex;gap:14px;padding:0 0 20px;position:relative}
.stage::before{content:'';position:absolute;left:13px;top:30px;bottom:0;width:1.5px;background:var(--r-line)}
.stage:last-child::before{display:none}
.stage .sn{flex:none;width:27px;height:27px;border-radius:50%;background:var(--r-raised);
  border:1px solid var(--r-line2);color:var(--r-text-2);font-weight:700;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;z-index:1}
.stage h4{font-size:13.5px;margin:3px 0 3px;font-weight:600}
.stage p{font-size:12.5px;color:var(--r-text-2)}
.stage .fail{color:var(--r-against);font-size:12px;margin-top:2px}
.stage .prep{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;font-weight:600;
  color:var(--r-explore);text-decoration:none}
.rd{margin:0 0 12px}
.rd .l{display:flex;justify-content:space-between;font-size:12.5px;margin:0 0 5px;color:var(--r-text-2)}
.rd .segs{display:flex;gap:3px}
.rd .segs i{flex:1;height:7px;border-radius:2px;background:var(--r-raised)}
.rd .segs i.f{background:var(--r-explore)}
.rd details{margin-top:5px}
.rd summary{font-size:11.5px;color:var(--r-text-3);cursor:pointer;list-style:none}
.rd summary::before{content:'▸ '}
.rd details[open] summary::before{content:'▾ '}
.rd .why{font-size:12px;color:var(--r-text-3);padding:6px 0 0}
.cmp-wrap{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
.cmp th,.cmp td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--r-line);vertical-align:top}
.cmp th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--r-text-3);font-weight:700}
.cmp td:first-child{color:var(--r-text-3);font-size:12px;white-space:nowrap}
.cmp .warn{color:var(--r-against)}
.kbar{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;
  padding:12vh 16px;background:rgba(4,6,10,.7)}
.kbar.open{display:flex}
.kpanel{width:100%;max-width:560px;background:var(--r-surface);border:1px solid var(--r-line2);border-radius:12px;overflow:hidden}
.kpanel input{border:none;border-bottom:1px solid var(--r-line);border-radius:0;background:none;padding:16px 18px;font-size:15px}
.kres{max-height:320px;overflow-y:auto}
.kres button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;
  padding:12px 18px;font-size:13.5px;color:var(--r-text-2);align-items:center}
.kres button:hover{background:var(--r-raised);color:var(--r-text)}
.kres .kt{font-size:10.5px;color:var(--r-text-3);text-transform:uppercase;letter-spacing:.06em;margin-left:auto}
.sticky-act{display:none}
@media(max-width:860px){
  .sticky-act{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:52px;z-index:55;
    padding:10px 14px;background:var(--r-surface);border-top:1px solid var(--r-line)}
  .sticky-act .btn-p,.sticky-act .btn-s{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:0ms !important;animation-duration:0ms !important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="lockup" href="../../index.html"><span class="lm">M</span><span class="lk"><b>METANOIA</b><i>LABS</i></span></a>
    <div class="prod">The Range · Bentang</div>
    <button class="nav-it" data-nav="range">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 18 8.5 9l3.5 5 4-7L21 18Z"/></svg>
      <span data-en="Your Range" data-id="Bentangmu">Your Range</span><span class="cnt" id="navCnt"></span></button>
    <button class="nav-it" data-nav="explore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7.5"/><path d="m16.8 16.8 4 4"/></svg>
      <span data-en="Explore" data-id="Jelajah">Explore</span></button>
    <button class="nav-it" data-nav="identity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
      <span data-en="Identity" data-id="Identitas">Identity</span><span class="cnt" id="navIdPct"></span></button>
    <button class="srch" id="srchBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7.5"/><path d="m16.8 16.8 4 4"/></svg><span data-en="Search" data-id="Cari">Search</span><kbd>⌘K</kbd></button>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="id">ID</button></div>
  </aside>

  <main class="main">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-quick"></section>
    <section class="view" id="v-identity"></section>
    <section class="view" id="v-directions"></section>
    <section class="view" id="v-ddetail"></section>
    <section class="view" id="v-explore"></section>
    <section class="view" id="v-company"></section>
    <section class="view" id="v-opp"></section>
    <section class="view" id="v-range"></section>
    <section class="view" id="v-compare"></section>
  </main>
</div>

<nav class="bbar">
  <button data-nav="range"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 18 8.5 9l3.5 5 4-7L21 18Z"/></svg><span data-en="Range" data-id="Bentang">Range</span></button>
  <button data-nav="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7.5"/><path d="m16.8 16.8 4 4"/></svg><span data-en="Explore" data-id="Jelajah">Explore</span></button>
  <button data-nav="identity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg><span data-en="Identity" data-id="Identitas">Identity</span></button>
  <button id="srchBtnM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/></svg><span data-en="Search" data-id="Cari">Search</span></button>
</nav>

<div class="kbar" id="kbar"><div class="kpanel">
  <input type="text" id="kInput" placeholder="Search companies, roles, directions…">
  <div class="kres" id="kRes"></div>
</div></div>

<script src="../../data/range/graph.js"></script>
<script src="../../data/range/fit.js"></script>
<script src="../../data/range/opportunities.js"></script>
<script src="js/app.js"></script>
</body>
</html>
