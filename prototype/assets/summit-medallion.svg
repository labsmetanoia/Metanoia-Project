<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="smG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D878"/>
      <stop offset=".55" stop-color="#D9B85C"/>
      <stop offset="1" stop-color="#B08A38"/>
    </linearGradient>
    <linearGradient id="smG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C96A"/>
      <stop offset="1" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="smBg" cx=".5" cy=".46" r=".55">
      <stop offset="0" stop-color="#0B1524"/>
      <stop offset=".8" stop-color="#070F1C"/>
      <stop offset="1" stop-color="#050A12"/>
    </radialGradient>
    <radialGradient id="smGlow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#C9A84C" stop-opacity=".14"/>
      <stop offset=".7" stop-color="#C9A84C" stop-opacity=".04"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <circle cx="200" cy="200" r="200" fill="url(#smBg)"/>
  <circle cx="200" cy="196" r="180" fill="url(#smGlow)"/>

  <!-- outer instrument rings with node dots -->
  <g fill="none" stroke="#C9A84C">
    <circle cx="200" cy="200" r="192" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="200" cy="200" r="176" stroke-opacity=".3" stroke-width="1" stroke-dasharray="1.5 7"/>
  </g>
  <g fill="#C9A84C" opacity=".55">
    <circle cx="200" cy="8" r="2.2"/>
    <circle cx="200" cy="392" r="2.2"/>
    <circle cx="8" cy="200" r="1.8" opacity=".6"/>
    <circle cx="392" cy="200" r="1.8" opacity=".6"/>
  </g>

  <!-- main ring -->
  <circle cx="200" cy="200" r="152" fill="none" stroke="url(#smG2)" stroke-width="2.2" stroke-opacity=".9"/>
  <circle cx="200" cy="200" r="146" fill="none" stroke="#C9A84C" stroke-width=".8" stroke-opacity=".25"/>

  <!-- mountain massif -->
  <g stroke-linejoin="round" stroke-linecap="round" transform="translate(200 210) scale(1.12) translate(-200 -210)">
    <!-- main peak, faceted -->
    <path d="M96 300 L164 190 L184 216 L204 158 L232 200 L262 172 L322 300"
          fill="rgba(5,10,18,.55)" stroke="url(#smG)" stroke-width="5"/>
    <!-- secondary left peak -->
    <path d="M76 316 L136 226 L158 254" fill="none" stroke="url(#smG)" stroke-width="4" opacity=".8"/>
    <!-- facet / ridge detail lines -->
    <g fill="none" stroke="#C9A84C" stroke-width="1.8" opacity=".55">
      <path d="M204 158 L196 208 L206 246 L198 292"/>
      <path d="M232 200 L244 240 L238 276"/>
      <path d="M164 190 L172 232 L160 268"/>
      <path d="M262 172 L280 224 L296 262"/>
    </g>
    <!-- snow / light facet accents -->
    <g fill="none" stroke="#F0D878" stroke-width="2.4" opacity=".85">
      <path d="M204 158 L190 186 L200 198"/>
      <path d="M232 200 L222 218"/>
    </g>
  </g>

  <!-- summit flag: pole, finial, swallow-tail pennant -->
  <g transform="translate(200 210) scale(1.12) translate(-200 -210)">
    <path d="M204 158 L204 84" stroke="url(#smG)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="204" cy="78" r="6" fill="#F0D878"/>
    <path d="M210 88 L282 96 L258 116 L282 136 L210 144 Z" fill="url(#smG)"/>
    <path d="M210 88 L210 144" stroke="#B08A38" stroke-width="2"/>
  </g>

  <!-- foreground contour strokes -->
  <g fill="none" stroke="#C9A84C" stroke-linecap="round" opacity=".5">
    <path d="M108 322 C 144 310 176 326 208 320 S 268 306 300 316" stroke-width="2"/>
    <path d="M126 340 C 160 330 190 344 222 338 S 268 328 286 334" stroke-width="1.6" opacity=".7"/>
  </g>
</svg>
