  </linearGradient>
  <radialGradient id="aur" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#E8C766" stop-opacity=".16"/><stop offset="1" stop-color="#E8C766" stop-opacity="0"/>
