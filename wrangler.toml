# Cloudflare Pages project configuration for metanoialabs.net.
#
# The static site is prototype/; serverless routes live in functions/ and
# run only on Cloudflare Pages (GitHub Pages serves the static files alone,
# and the site then shows its "accounts not open yet" states).
#
# One-time setup (see docs/14-api-and-deployment.md):
#   npx wrangler d1 create metanoia                 → paste the database_id below
#   npx wrangler d1 migrations apply metanoia       → applies migrations/*.sql
#   npx wrangler pages secret put SESSION_SECRET    (32+ random bytes)
#   npx wrangler pages secret put SUBJECT_KEY       (32+ random bytes; rotate quarterly)
#   npx wrangler pages secret put ADMIN_TOKEN
#   npx wrangler pages secret put RESEND_API_KEY    (optional until e-mail is wanted)
#
# Local development:
#   npx wrangler d1 migrations apply metanoia --local
#   npx wrangler pages dev

name = "metanoia-labs"
compatibility_date = "2025-07-18"
pages_build_output_dir = "prototype"

[[d1_databases]]
binding = "DB"
database_name = "metanoia"
database_id = "d4ced8e5-f577-4f25-93ca-45bafff74974"   # D1 "metanoia", APAC
migrations_dir = "migrations"

[vars]
SITE_URL = "https://metanoialabs.net"
MAIL_FROM = "Metanoia Labs <hello@metanoialabs.net>"
LEADS_NOTIFY_TO = "hello@metanoialabs.net"
AUTH_ENABLED = "false"           # Tier 0: register/login answer 404 and the pages show the waitlist; "true" opens accounts to everyone.
                                 # Reviewer accounts before that: set the ADMIN_EMAILS secret in the dashboard (comma-separated
                                 # addresses). Those addresses can register and get the admin role; the public keeps the guest preview.
# Lesson media (prototype/assets/lms, about 2 GB, files over the 25 MiB Pages limit) is served
# from the R2 bucket behind this host. The build rewrites the registries to it and drops the
# folder from the output. It has to live here: with a wrangler.toml present, Pages ignores
# variables typed into the dashboard (secrets excepted).
MEDIA_BASE = "https://media.metanoialabs.net"
