# Cloudflare Pages project configuration for metanoialabs.net.
#
# The static site is prototype/; serverless routes live in functions/ and
# run only on Cloudflare Pages (GitHub Pages serves the static files alone,
# and the site then shows its "accounts not open yet" states).
#
# One-time setup (see docs/14-api-and-deployment.md):
#   npx wrangler d1 create metanoia                 → paste the database_id below
#   npx wrangler d1 migrations apply metanoia       → applies migrations/*.sql
#   npx wrangler pages secret put SESSION_SECRET    (32+ random bytes)
#   npx wrangler pages secret put SUBJECT_KEY       (32+ random bytes; rotate quarterly)
#   npx wrangler pages secret put ADMIN_TOKEN
#   npx wrangler pages secret put RESEND_API_KEY    (optional until e-mail is wanted)
#
# Local development:
#   npx wrangler d1 migrations apply metanoia --local
#   npx wrangler pages dev

name = "metanoia-labs"
compatibility_date = "2025-07-18"
pages_build_output_dir = "prototype"

[[d1_databases]]
binding = "DB"
database_name = "metanoia"
database_id = "d4ced8e5-f577-4f25-93ca-45bafff74974"   # D1 "metanoia", APAC
migrations_dir = "migrations"

[vars]
SITE_URL = "https://metanoialabs.net"
MAIL_FROM = "Metanoia Labs <hello@metanoialabs.net>"
LEADS_NOTIFY_TO = "hello@metanoialabs.net"
AUTH_ENABLED = "true"            # Open registration since 2026-11-08 (Tier 1). "false" closes register/login (404) and the pages show
                                 # the waitlist; the ADMIN_EMAILS secret (dashboard, comma-separated) still grants the admin role to
                                 # those addresses at registration or next sign-in.
BETA_ENDS_AT = "2026-11-22"      # Beta programme end (decision of 2026-11-08). Shown on the pricing page and status board; health
                                 # reports it; accounts created before it are founding members. Access does not change on that
                                 # date by itself: a paid pass needs explicit approval first (Tier 1 brief, Part 11).
ACCESS_MODE = "beta"             # "beta": every signed-in member may use every product (the beta promise; stays in force past
                                 # BETA_ENDS_AT until this is flipped). "entitlements": a product opens only with an entitlement
                                 # row (admin grant, enterprise seat, later a paid pass; server/lib/entitlements.js). Flip only
                                 # after members have been told, per the pricing page's beta wording.
# Lesson media (prototype/assets/lms, about 2 GB, files over the 25 MiB Pages limit) is served
# from the R2 bucket behind this host. The build rewrites the registries to it and drops the
# folder from the output. It has to live here: with a wrangler.toml present, Pages ignores
# variables typed into the dashboard (secrets excepted).
MEDIA_BASE = "https://media.metanoialabs.net"
# Sign in with Google / LinkedIn (server/lib/oauth.js). The client ids are public; the matching
# GOOGLE_CLIENT_SECRET and LINKEDIN_CLIENT_SECRET are Pages secrets. Empty id = provider off, and
# the login and register pages keep the button disabled. Redirect URI to register with each provider:
#   https://metanoialabs.net/api/auth/oauth/google/callback
#   https://metanoialabs.net/api/auth/oauth/linkedin/callback
GOOGLE_CLIENT_ID = "451617643748-pu8k9j3vbhgr8rs8t21d65odi6cqr54g.apps.googleusercontent.com"
LINKEDIN_CLIENT_ID = ""
